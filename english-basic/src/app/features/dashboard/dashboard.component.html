<main class="dashboard">
  <h1>Hola, {{ userName() }}</h1>
  <p class="dashboard-subtitle">Bienvenido de vuelta a English Basic.</p>

  <section class="dashboard-card">
    <h2>Suscripción</h2>
    <p class="dashboard-status">Plan gratuito (FREE)</p>
    <p class="dashboard-hint">La gestión de suscripciones estará disponible próximamente.</p>

  <nav class="dashboard-links">

    <a routerLink="/perfil">Mi perfil</a>

  <button class="dashboard-logout" type="button" (click)="onLogout()">Cerrar sesión</button>
