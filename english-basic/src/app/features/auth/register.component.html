<main class="auth-page">
  <section class="auth-card">
    <h1 class="auth-title">Crear cuenta</h1>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <label class="auth-field">
        <span>Nombre</span>
        <input
          type="text"
          formControlName="fullName"
          autocomplete="name"
          placeholder="Tu nombre completo"
        />
      </label>

      <label class="auth-field">
        <span>Email</span>
        <input
          type="email"
          formControlName="email"
          autocomplete="email"
          placeholder="tu@email.com"
        />
      </label>

      <label class="auth-field">
        <span>Contraseña</span>
        <input
          type="password"
          formControlName="password"
          autocomplete="new-password"
          placeholder="Mínimo 6 caracteres"
        />
      </label>

      @if (errorMessage) {
        <p class="auth-message auth-message--error">{{ errorMessage }}</p>
      }
      @if (successMessage) {
        <p class="auth-message auth-message--success">{{ successMessage }}</p>
      }

      <button class="auth-button" type="submit" [disabled]="form.invalid || loading">
        {{ loading ? 'Creando cuenta...' : 'Crear cuenta' }}
      </button>
    </form>

    <nav class="auth-links">
      <a routerLink="/login">¿Ya tienes cuenta? Inicia sesión</a>
    </nav>
  </section>
</main>
