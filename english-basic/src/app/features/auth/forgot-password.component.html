<main class="auth-page">
  <section class="auth-card">
    <h1 class="auth-title">Recuperar contraseña</h1>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <label class="auth-field">
        <span>Email</span>
        <input
          type="email"
          formControlName="email"
          autocomplete="email"
          placeholder="tu@email.com"
        />
      </label>

      @if (errorMessage) {
        <p class="auth-message auth-message--error">{{ errorMessage }}</p>
      }
      @if (successMessage) {
        <p class="auth-message auth-message--success">{{ successMessage }}</p>
      }

      <button class="auth-button" type="submit" [disabled]="form.invalid || loading">
        {{ loading ? 'Enviando...' : 'Enviar enlace de recuperación' }}
      </button>
    </form>

    <nav class="auth-links">
      <a routerLink="/login">Volver a iniciar sesión</a>
    </nav>
  </section>
</main>
